name: Validate Skills Structure

on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Verify Skill Folder Structure
        run: |
          echo "Scanning repository for skill folders..."
          errors=0
          
          # Loop through all top-level directories except hidden ones (.git, .github)
          for dir in */; do
            # Skip hidden configuration directories
            if [[ "$dir" =~ ^\..* ]]; then
              continue
            fi
            
            # Clean trailing slash for evaluation output
            folder_name="${dir%/}"
            
            echo "Checking folder: $folder_name"
            
            # Verify the mandatory skill.md file exists inside the folder
            if [ ! -f "${folder_name}/skill.md" ]; then
              echo "❌ Error: Missing required 'skill.md' file inside folder '${folder_name}'"
              errors=$((errors + 1))
            else
              echo "✅ Pass: '${folder_name}/skill.md' found."
            fi
          done
          
          # Exit cleanly if errors are found to reject the Pull Request build
          if [ $errors -gt 0 ]; then
            echo "Validation process failed with $errors error(s)."
            exit 1
          fi
          
          echo "All skills successfully passed structure validation rules!"
